<!doctype html><html><body style="margin:0;background:#fbf7ef;font-family:Arial,Helvetica,sans-serif;color:#3a2e22">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#fbf7ef;padding:24px 0"><tr><td align="center">
<table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #eadfca;overflow:hidden">
<tr><td style="background:#3b2b1e;padding:18px 28px;color:#ffffff;font-size:20px;font-weight:bold">Universe <span style="color:#e2b94e">Tech</span></td></tr>
<tr><td style="padding:28px">
<h2 style="margin:0 0 14px;color:#2b1d10;font-size:20px">{{ subject }}</h2>
<p style="font-size:15px;line-height:1.6;white-space:pre-line;margin:0 0 22px">{{ message }}</p>
{% if link %}<p style="margin:0 0 8px"><a href="{{ link }}" style="background:#3b2a1a;color:#ffffff;text-decoration:none;padding:12px 26px;border-radius:999px;font-weight:bold;display:inline-block">{{ button }}</a></p>
<p style="font-size:12px;color:#7b6c5a">Or open: {{ link }}</p>{% endif %}
</td></tr>
<tr><td style="padding:16px 28px;background:#fbf7ef;font-size:12px;color:#7b6c5a">You receive this because you have an account with {{ site }}. You can switch email copies off in Profile &amp; settings; alerts always stay on the website.</td></tr>
</table></td></tr></table></body></html>
