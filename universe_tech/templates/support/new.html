{% extends "base.html" %}
{% block title %}Open a ticket | Universe Tech{% endblock %}
{% block content %}
<section class="ivory page-head"><div class="wrap"><h1>Open a ticket</h1></div></section>
<section class="ivory"><div class="wrap narrow">
  <form method="post" class="form">{% csrf_token %}
    {% for f in form %}<div class="field">{{ f.label_tag }}{{ f }}{% for e in f.errors %}<p class="err">{{ e }}</p>{% endfor %}</div>{% endfor %}
    <button class="btn btn-gold" type="submit">Send</button>
  </form>
</div></section>
{% endblock %}
